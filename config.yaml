data_sources:
  news:
  - enabled: true
    name: neodata
    optional: true
    params:
      endpoint: https://copilot.tencent.com/agenttool/v1/neodata
      token: ''
    provider: NeoDataProvider
    timeout: 30
  - enabled: true
    name: westock_hot
    optional: true
    params:
      command: npx -y westock-data-clawhub@1.0.4
    provider: WeStockProvider
    timeout: 30
  - enabled: true
    name: sina_rss
    params:
      max_items: 50
      url: https://feed.sina.com.cn/api/roll/get?pageid=155&lid=1686&num=50
    provider: SinaNewsProvider
    timeout: 15
  - enabled: true
    name: bbc_world
    optional: true
    params:
      url: https://feeds.bbci.co.uk/news/world/rss.xml
    provider: RSSProvider
    timeout: 15
  - enabled: true
    name: bbc_business
    optional: true
    params:
      url: https://feeds.bbci.co.uk/news/business/rss.xml
    provider: RSSProvider
    timeout: 15
  - enabled: true
    name: bbc_top
    optional: true
    params:
      url: https://feeds.bbci.co.uk/news/rss.xml
    provider: RSSProvider
    timeout: 15
  - enabled: true
    name: bbc_technology
    optional: true
    params:
      url: https://feeds.bbci.co.uk/news/technology/rss.xml
    provider: RSSProvider
    timeout: 15
  - enabled: true
    name: reuters_world
    optional: true
    params:
      url: https://news.google.com/rss/search?q=reuters+world&hl=en-US&gl=US&ceid=US:en
    provider: RSSProvider
    timeout: 15
  - enabled: true
    name: npr_news
    optional: true
    params:
      url: https://feeds.npr.org/1001/rss.xml
    provider: RSSProvider
    timeout: 15
  - enabled: true
    name: aljazeera
    optional: true
    params:
      url: https://feeds.aljazeera.net/xml/rss/all.xml
    provider: RSSProvider
    timeout: 15
  - enabled: true
    name: tencent_news
    optional: true
    params:
      max_items: 50
    provider: TencentNewsHTTPProvider
    timeout: 30
  - enabled: true
    name: multi_search
    optional: true
    params:
      keywords:
      - 宏观
      - 政策
      max_items: 30
      primary_engine: duckduckgo
    provider: SearchEngineNewsProvider
    timeout: 15
  structured:
  - enabled: true
    name: westock
    params:
      command: npx -y westock-data-clawhub@1.0.4
    provider: WeStockProvider
    timeout: 30
  - enabled: true
    name: sina
    params:
      quote_url: https://hq.sinajs.cn/list={codes}
    provider: SinaProvider
    timeout: 15
  - enabled: true
    name: neodata
    optional: true
    params:
      endpoint: https://copilot.tencent.com/agenttool/v1/neodata
      token: ''
    provider: NeoDataProvider
    timeout: 30
database:
  path: marketlens.db
evidence:
  finance_limit: 4
  fund_flow_limit: 5
  kline_limit: 60
  news_days: 7
markets:
  fut:
    asset_types:
    - future
    note: 期货代码不含市场前缀，如 rb2501、IF2506、sc2401
    prefix: fut
  hf:
    asset_types:
    - commodity
    note: 国际商品（如 hf_XAU 伦敦金、hf_XAG 伦敦银）
    prefix: hf
  hk:
    asset_types:
    - stock
    - etf
    - index
    prefix: hk
  nf:
    asset_types:
    - future
    note: 国内商品期货（如 nf_AU0 沪金连续、nf_SC0 原油连续）
    prefix: nf
  sh:
    asset_types:
    - stock
    - etf
    - index
    prefix: sh
  sz:
    asset_types:
    - stock
    - etf
    - index
    prefix: sz
  us:
    asset_types:
    - stock
    - etf
    - index
    prefix: us
scheduler:
  tasks:
    ai_report:
      cron: 0 20 * * *
    daily_close:
      cron: 0 16 * * 1-5
    news:
      interval: 60
    quote:
      interval: 1
    cleanup:
      cron: 30 3 * * *
  timezone: Asia/Shanghai
cleanup:
  # 过期数据清理注册表：表名 → (时间列名, 保留天数)
  # 时间列名语义：
  #   - collected_at: 采集时间戳，按"采集时间"滚动保留（适合 etf_basic/etf_holdings/us_financials
  #     等因 UNIQUE(code/symbol, date, source) 每日 upsert 的表，保留 N 天采集快照即可）
  #   - date / report_date / event_date / report_period: 数据所属业务日期，按"业务日期"滚动保留
  #     （适合按日增量写入的行情/榜单/事件类表）
  # 保留天数原则：
  #   - 行情/榜单/事件类（每日增量、价值随时间衰减）：365 天
  #   - 财报/净值/历史/大单/龙虎榜（业务分析价值高）：1825 天（5 年）
  # raw_data 仅 30 天（占空间大），news_items 90 天（要兼顾时效与可回溯）。
  retention:
    raw_data: {time_col: collected_at, days: 30}
    news_items: {time_col: collected_at, days: 90}
    etf_basic: {time_col: collected_at, days: 365}
    etf_holdings: {time_col: collected_at, days: 365}
    etf_nav_history: {time_col: date, days: 1825}
    etf_holders: {time_col: report_date, days: 365}
    etf_financial: {time_col: date, days: 1825}
    sector_daily_quote: {time_col: date, days: 365}
    us_financials: {time_col: collected_at, days: 1825}
    ipo_exdiv_calendar: {time_col: event_date, days: 1825}
    chip_distribution: {time_col: date, days: 365}
    margintrade_data: {time_col: date, days: 365}
    blocktrade_data: {time_col: date, days: 1825}
    lhb_data: {time_col: date, days: 1825}
    profit_forecasts: {time_col: report_period, days: 1825}
security:
  api_key: marketlens-local
  cors_origins:
  - '*'
  # CORS 方法/请求头：代码层固定回退到 ["GET","POST","PUT","DELETE","PATCH"] +
  # ["Content-Type","Authorization","X-API-Key"]；此处显式声明后即可在不改代码的情况下
  # 调整（典型场景：增加 PATCH/OPTIONS、补自定义 header）。
  cors_methods:
  - GET
  - POST
  - PUT
  - DELETE
  - PATCH
  cors_headers:
  - Content-Type
  - Authorization
  - X-API-Key
sentiment:
  api_key: ''
  base_url: https://api.deepseek.com
  model: deepseek-v4-pro
  optional: true
  provider: deepseek
  thinking_by_use_case:
    narrative_summary:
      enabled: true
      reasoning_effort: high
    news:
      enabled: false
      # news 路径用 default "high" 也可（code 兜底），但显式声明便于排查
      reasoning_effort: high
  timeout: 60
