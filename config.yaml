# --------------------------------------------------------------------------
# ?????
# --------------------------------------------------------------------------
# structured: ??????????K????????????????
#   - provider: ?? backend/collectors/ ?? Provider ??
#   - enabled: ????????
#   - optional: ? true ???????????????????
#   - timeout: ????????
# ???????????????????????
data_sources:
  structured:
  - name: westock
    provider: WeStockProvider
    enabled: true
    timeout: 30
    params:
      command: npx -y westock-data-clawhub@1.0.4
  - name: sina
    provider: SinaProvider
    enabled: true
    timeout: 15
    params:
      quote_url: https://hq.sinajs.cn/list={codes}
  - name: neodata
    provider: NeoDataProvider
    enabled: true
    optional: true
    timeout: 30
    params:
      endpoint: https://copilot.tencent.com/agenttool/v1/neodata
      token: ''
  # --------------------------------------------------------------------------
  # ??????news?
  # --------------------------------------------------------------------------
  news:
  - name: neodata
    provider: NeoDataProvider
    enabled: true
    optional: true
    timeout: 30
    params:
      endpoint: https://copilot.tencent.com/agenttool/v1/neodata
      token: ''
  - name: westock_hot
    provider: WeStockProvider
    enabled: true
    optional: true
    timeout: 30
    params:
      command: npx -y westock-data-clawhub@1.0.4
  - name: sina_rss
    provider: SinaNewsProvider
    enabled: true
    timeout: 15
    params:
      url: https://feed.sina.com.cn/api/roll/get?pageid=155&lid=1686&num=50
      max_items: 50
  - name: bbc_world
    provider: RSSProvider
    enabled: true
    optional: true
    timeout: 15
    params:
      url: https://feeds.bbci.co.uk/news/world/rss.xml
  - name: bbc_business
    provider: RSSProvider
    enabled: true
    optional: true
    timeout: 15
    params:
      url: https://feeds.bbci.co.uk/news/business/rss.xml
  - name: bbc_top
    provider: RSSProvider
    enabled: true
    optional: true
    timeout: 15
    params:
      url: https://feeds.bbci.co.uk/news/rss.xml
  - name: bbc_technology
    provider: RSSProvider
    enabled: true
    optional: true
    timeout: 15
    params:
      url: https://feeds.bbci.co.uk/news/technology/rss.xml
  - name: reuters_world
    provider: RSSProvider
    enabled: true
    optional: true
    timeout: 15
    params:
      url: https://news.google.com/rss/search?q=reuters+world&hl=en-US&gl=US&ceid=US:en
  - name: npr_news
    provider: RSSProvider
    enabled: true
    optional: true
    timeout: 15
    params:
      url: https://feeds.npr.org/1001/rss.xml
  - name: aljazeera
    provider: RSSProvider
    enabled: true
    optional: true
    timeout: 15
    params:
      url: https://www.aljazeera.com/xml/rss/all.xml
  - name: tencent_news
    provider: TencentNewsHTTPProvider
    enabled: true
    optional: true
    timeout: 30
    params:
      max_items: 50
  - name: multi_search
    provider: SearchEngineNewsProvider
    enabled: true
    optional: true
    timeout: 15
    params:
      primary_engine: duckduckgo
      max_items: 30
      keywords:
      - ????
      - ??

