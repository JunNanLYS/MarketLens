    prefix: sz
    asset_types:
    - stock
    - etf
    - index
  hk:
    prefix: hk
    asset_types:
    - stock
    - etf
    - index
  us:
    prefix: us
    asset_types:
    - stock
    - etf
    - index
  fut:
    prefix: fut
    asset_types:
    - future
    note: ???????????? rb2501?IF2506?sc2401

  hf:
    prefix: hf
    asset_types:
    - commodity
    note: ????(? hf_XAU ????hf_XAG ???)
  nf:
    prefix: nf
    asset_types:
    - future
    note: ??????(? nf_AU0 ?????nf_SC0 ????)

