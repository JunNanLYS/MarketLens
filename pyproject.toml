[project]
name = "marketlens"
version = "0.1.0"
description = "本地优先、证据驱动的 AI 金融研究助理系统"
authors = [{name = "MarketLens Team"}]
license = {text = "MIT"}
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "apscheduler",
    "pandas",
    "loguru",
    "pyyaml",
    "httpx",
    "streamlit",
    "pydantic",
    "aiosqlite>=0.22.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
