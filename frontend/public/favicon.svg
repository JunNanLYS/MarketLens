<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- 放大镜外圈 -->
  <circle cx="14" cy="14" r="10" stroke="#0F2D5C" stroke-width="2.5" fill="none"/>
  <!-- 放大镜手柄 -->
  <line x1="21.2" y1="21.2" x2="28" y2="28" stroke="#0F2D5C" stroke-width="2.5" stroke-linecap="round"/>
  <!-- K线：阳线（涨） -->
  <line x1="8" y1="18" x2="8" y2="10" stroke="#16A34A" stroke-width="1.5"/>
  <rect x="6.5" y="12" width="3" height="4" rx="0.5" fill="#16A34A"/>
  <!-- K线：阴线（跌） -->
  <line x1="14" y1="11" x2="14" y2="19" stroke="#DC2626" stroke-width="1.5"/>
  <rect x="12.5" y="13" width="3" height="4" rx="0.5" fill="#DC2626"/>
  <!-- 趋势线 -->
  <polyline points="6,17 10,14 14,16 18,11" stroke="#2563EB" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>