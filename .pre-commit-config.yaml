# Pre-commit hooks for MarketLens
# 单用户本地工具的提交前质量门禁：
#   1. 文件卫生 + Python AST 语法检查
#   2. ruff lint + format
#   3. 前端检查 type-check + build
#   4. pytest（pre-push 时）
#
# 安装：uv run pre-commit install --hook-type pre-commit --hook-type pre-push
# 手动跑全部：uv run pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-ast

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: frontend-check
        name: npm type-check + build
        entry: bash -c "cd frontend && npm run type-check && npm run build"
        language: system
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest fast
        entry: uv run pytest tests/ -x -q
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
